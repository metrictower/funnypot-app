protocol: smtp
listen: [25]
severity: medium
tags: [protocol, smtp, mail]
framing: line
# Stateful SMTP engine (src/Protocol/Smtp/SmtpSession.php): a real greeting -> MAIL -> RCPT ->
# DATA -> queued conversation. The old flat rule list was stateless, so after DATA it answered
# every body line with "502 command not recognized" — a protocol violation an MTA probe reads
# as an obvious tell. The engine also harvests AUTH credentials and captures the message body.
# It NEVER stores or relays real mail (no open relay) and NEVER executes anything.
engine: smtp
# No `banner:` here — the engine emits its own 220 greeting from this box's seeded hostname, so
# the SMTP banner host matches the hostname the telnet/ssh prompt and uname show (cross-protocol
# coherence). A hardcoded banner host would contradict them.
