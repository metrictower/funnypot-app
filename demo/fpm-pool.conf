; funnypot demo — size the worker pool for a scanner's concurrency. Each worker caches
; the compiled index once (PhpArrayStore), so memory is ~per-worker; tune max_children
; to your box (16 workers ~ a few hundred MB).
[www]
; fpm on 9001 so nginx can serve on 9000 (a common web port).
listen = 127.0.0.1:9001
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; recycle workers occasionally to bound memory
pm.max_requests = 2000
catch_workers_output = yes

; FP-0310: the root CLI service supervisor uses pcntl_fork / pcntl_waitpid / posix_kill to control
; listener children, so the image installs ext-pcntl (CLI). PHP-FPM must NEVER get those primitives:
; this per-pool denylist is the global opcache.ini exec/proc set PLUS fork/wait/signal/kill, so a
; hijacked worker cannot fork a listener or signal a process. (php_admin_value cannot be re-widened by
; ini_set at runtime.) opcache.ini keeps pcntl_exec denied everywhere, including the CLI.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,proc_close,proc_get_status,proc_nice,proc_terminate,pcntl_exec,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_signal,pcntl_signal_dispatch,posix_kill,posix_setuid,posix_setgid
