; funnypot demo — opcache tuned for the ~5 MB compiled index.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
; revalidate every request so bind-mounted code edits are picked up in dev; the index
; array itself is cached per worker in PHP (PhpArrayStore) so this stays cheap.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; do not leak the real PHP version (the app also replaces X-Powered-By)
expose_php=Off

; Never render errors to the response — a leaked trace/path/class name is an information leak and a
; decisive honeypot tell. Log them instead (to the fpm error log / container stderr). The front
; controller also installs a fault handler that turns any uncaught error into a plain 404.
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL
