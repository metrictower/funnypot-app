; funnypot demo — APCu, the config store's cross-worker read-cache (FP-0242a, spec §3).
; The 16 php-fpm workers share one APCu segment: an admin write drops the cached snapshot and every
; other worker rebuilds on its next read (no stale window inside the pool). The long-lived CLI
; listeners each hold their OWN segment, so cross-SAPI invalidation rides the config.gen sentinel
; file, not APCu — hence enable_cli below only gives each listener a small private cache, it is not
; the cross-process channel.
extension=apcu.so
apc.enable=1
; The protocol listeners + retention/rollup/drain runners are CLI processes; without this their APCu
; calls no-op and every config read is a SQLite SELECT. The config snapshot is a few dozen tiny rows,
; so the per-process cache stays well under the shm size even across 30+ listeners.
apc.enable_cli=1
; The resolved config snapshot is tiny (a few dozen keys); 16M is ample headroom and bounds the
; per-process footprint of the CLI listeners.
apc.shm_size=16M
