# Shared routing: every request → the funnypot front controller. Included by both the
# HTTP and HTTPS server blocks. $funnypot_https is set per-block (off / on) so PHP's
# $_SERVER['HTTPS'] reflects the real scheme.
root /app/demo;

# Let's Encrypt HTTP-01 challenge: served as a real static file from the mounted webroot,
# never handed to the honeypot. `^~` wins over `location /` so certbot tokens resolve.
location ^~ /.well-known/acme-challenge/ {
    root /var/acme;
    default_type "text/plain";
    try_files $uri =404;
}

# The backup-download bait (/__dl/sw.js, manifest, backup.zip), bounded ahead of PHP. The app's
# per-IP velocity gate deliberately exempts this route, so without this block sixteen slow readers of
# the 50 MiB fallback would hold every php-fpm worker and nginx would spool 50 MiB of temp file per
# request. Same front controller as `location /` — what is served is unchanged — only the envelope:
#   - 2 concurrent transfers per source, 4 in total: at most 4 of the 16 workers can ever be held by
#     slow readers, the rest stay with the deception (zones in nginx.conf);
#   - 6 starts per minute per source, burst 3 without delay — a browser's sw.js + manifest + zip
#     sequence fits, a hammer does not;
#   - 2 MiB/s per connection (the 50 MiB fallback takes ~25 s; a bored scanner cancels sooner);
#   - a 4 MiB FastCGI spool cap: past it nginx stops buffering to disk and the worker is paced by the
#     client, so temp disk is ≤ 4 MiB × the global limit, never 50 MiB × N.
# A throttled request gets the controlled 429 below, never nginx's stock error page.
location ^~ /__dl/ {
    limit_conn funnypot_dl_ip 2;
    limit_conn funnypot_dl_all 4;
    limit_req zone=funnypot_dl_req burst=3 nodelay;
    limit_conn_status 429;
    limit_req_status 429;
    limit_rate 2m;
    fastcgi_max_temp_file_size 4m;
    error_page 429 = @funnypot_dl_throttled;
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9001;
    fastcgi_param SCRIPT_FILENAME /app/demo/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS $funnypot_https;
    fastcgi_read_timeout 15s;
}

# The throttle response: a short plain body and a Retry-After, shaped like any busy download host's.
# `return` with an explicit body bypasses nginx's branded default page; the status is fixed by the
# code, never by content.
location @funnypot_dl_throttled {
    default_type text/plain;
    add_header Retry-After 10 always;
    add_header Cache-Control no-store always;
    return 429 "Too many concurrent downloads. Retry shortly.\n";
}

location / {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9001;
    fastcgi_param SCRIPT_FILENAME /app/demo/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS $funnypot_https;
    fastcgi_read_timeout 15s;
}
