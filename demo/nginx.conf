# funnypot listens on the common HTTP + alt-HTTP + app/panel ports scanners sweep, plus HTTPS
# (self-signed, or a real cert for the admin host) on the common TLS ports. Every port routes
# to the same front controller. Ports grounded in the web/alt-web/app-panel ports nuclei
# templates + shodan/naabu sweeps target.
#
# NOTE: this port list must stay in sync with PORTS in scripts/deploy.sh (docker publishes them)
# and with the EC2 security-group inbound rules (the SG is what actually gates reachability).

# Plain HTTP + alt-HTTP + app/panel ports.
server {
    listen 80 default_server;
    listen 81;
    listen 88;
    listen 591;
    listen 2082;
    listen 2086;
    listen 2095;
    listen 3000;
    listen 3128;
    listen 5000;
    listen 5601;
    listen 7001;
    listen 7070;
    listen 7080;
    listen 8000;
    listen 8001;
    listen 8008;
    listen 8009;
    listen 8080;
    listen 8081;
    listen 8082;
    listen 8083;
    listen 8088;
    listen 8090;
    listen 8161;
    listen 8180;
    listen 8500;
    listen 8880;
    listen 8888;
    listen 8983;
    listen 9000;
    listen 9080;
    listen 9090;
    listen 9200;
    listen 10000;
    # Additional common scanner-swept app ports (Docker API, CouchDB, Neo4j, Odoo, InfluxDB,
    # Vault, RabbitMQ, node_exporter, ADB). One nginx serves them all — no per-port process.
    listen 2375;
    listen 4243;
    listen 5555;
    listen 5984;
    listen 7474;
    listen 8069;
    listen 8086;
    listen 8181;
    listen 8065;
    listen 8200;
    listen 9100;
    listen 15672;
    server_name _;
    server_tokens off;
    access_log off;
    set $funnypot_https off;
    include /etc/nginx/funnypot-location.conf;
}

# HTTPS on the common TLS ports (self-signed cert generated at container start).
server {
    listen 443 ssl default_server;
    listen 2083 ssl;
    listen 2087 ssl;
    listen 2096 ssl;
    listen 4433 ssl;
    listen 4443 ssl;
    listen 8443 ssl;
    listen 8834 ssl;
    listen 8843 ssl;
    listen 9443 ssl;
    listen 10443 ssl;
    server_name _;
    server_tokens off;
    access_log off;
    ssl_certificate /etc/nginx/funnypot.crt;
    ssl_certificate_key /etc/nginx/funnypot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $funnypot_https on;
    include /etc/nginx/funnypot-location.conf;
}
