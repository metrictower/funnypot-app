# funnypot standalone honeypot — nginx + php-fpm, HTTP + HTTPS across the common web
# ports. Baked, portable image (no source mount) — drop on a server and go:
#   cd demo && docker compose up -d --build
# then hit it on http://HOST (:80/:8080/…) or https://HOST (:443/:8443, per-install decoy cert).
services:
  # One-shot identity preflight on the REAL data volume with no network and no published port:
  # resolves/creates the persisted install master and verifies TLS exactly as the public container's
  # entrypoint will. If it fails, the public service below never starts (nothing binds a socket).
  funnypot-prepare:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    image: funnypot
    network_mode: none
    entrypoint: ["php", "/app/bin/funnypot", "identity:prepare"]
    volumes:
      - funnypot-storage:/app/demo/storage

  funnypot:
    build:
      context: ..                 # repo root — the Dockerfile copies src/ resources/ bin/ from there
      dockerfile: demo/Dockerfile
    image: funnypot
    depends_on:
      funnypot-prepare:
        condition: service_completed_successfully
    # The reduced local profile of demo/ports.json (its `compose` target): web + the six classic
    # TCP emulators, no UDP, no forwards. `php scripts/check-ports.php` fails if this list drifts.
    ports:
      # TCP protocol honeypots (redis/ftp/smtp/telnet/memcached/ssh).
      - "21:21"
      - "23:23"
      - "25:25"
      - "2222:2222"
      - "6379:6379"
      - "11211:11211"
      # HTTP / HTTPS.
      - "80:80"
      - "443:443"
      - "3000:3000"
      - "4443:4443"
      - "5000:5000"
      - "8000:8000"
      - "8008:8008"
      - "8080:8080"
      - "8081:8081"
      - "8088:8088"
      - "8090:8090"
      - "8161:8161"
      - "8443:8443"
      - "8888:8888"
      - "8983:8983"
      - "9000:9000"
      - "9090:9090"
      - "9443:9443"
      - "10443:10443"
    environment:
      FUNNYPOT_STYLE: realistic    # minimal | realistic | taunt
      # FUNNYPOT_ADMIN_PASSWORD: change-me   # enables the dashboard prune/clear/geoip actions
      # FUNNYPOT_HONEYTOKEN_KEY: change-me    # enables the tamper-evident bait cookie
      # FUNNYPOT_DB: "off"                     # disable the SQLite store (file-only stats)
      # FUNNYPOT_PERSONA_SEED: my-visible-persona   # optional cosmetic persona override (see docs/IDENTITY.md)
      # FUNNYPOT_DEV: "1"   # with the source bind-mounts below: revalidate opcache timestamps per request
    restart: unless-stopped
    # Bounded container logs: stdout/stderr (hit JSON lines, listener respawn notices, PHP errors)
    # rotate at 5 x 10 MiB instead of one json-file growing forever. The persisted hit store on the
    # volume is the record; this log is diagnostics.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # Persist the hit log + SQLite store + geoip data + the private install identity (.funnypot/)
      # across container recreation. The SAME volume the preflight above prepared.
      - funnypot-storage:/app/demo/storage
    # For local dev with instant code edits, also bind-mount the source AND set FUNNYPOT_DEV=1 above
    # (the production image freezes opcache timestamps, so edits are invisible without it):
    #   - ../src:/app/src:ro
    #   - ../resources:/app/resources:ro
    #   - ../demo:/app/demo

volumes:
  funnypot-storage:
